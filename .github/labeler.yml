# down 自动标签：按分支名 + 实际文件结构（替代通用站点模板，修 #2）
# 由 .github/workflows/auto-label.yml（actions/labeler@v5, sync-labels) 驱动
fix:
  - head-branch: ["^fix"]
feat:
  - head-branch: ["^feat", "^feature"]
docs:
  - head-branch: ["^docs"]
  - changed-files: ["**/*.md"]
chore:
  - head-branch: ["^chore"]
deps:
  - head-branch: ["^dependabot"]
infra:
  - changed-files: [".github/**"]
scripts:
  - changed-files: ["scripts/**"]
tests:
  - changed-files: ["evals/**"]